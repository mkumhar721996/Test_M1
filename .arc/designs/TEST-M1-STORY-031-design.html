      <form novalidate onsubmit="handleSubmit(event, 'populated')">
        <div class="form-field">
          <label class="label" for="amount-populated">Amount <span class="required-mark" aria-hidden="true">*</span></label>
          <div class="amount-input-wrap">
            <span class="amount-prefix" aria-hidden="true">$</span>
            <input class="input amount-input" type="number" min="0" step="0.01" inputmode="decimal" id="amount-populated" name="amount" placeholder="0.00" aria-describedby="preview-amount-populated error-amount-populated" oninput="updateAmountPreview('populated')">
          </div>
          <p class="field-preview u-text-sm u-text-muted" id="preview-amount-populated"></p>
          <p class="field-error" id="error-amount-populated" role="alert"></p>
        </div>
        <div class="form-field">
          <label class="label" for="date-populated">Date <span class="required-mark" aria-hidden="true">*</span></label>
          <input class="input" type="date" id="date-populated" name="date" aria-describedby="error-date-populated">
          <p class="field-error" id="error-date-populated" role="alert"></p>
        </div>
        <div class="form-field">
          <label class="label" for="category-populated">Category <span class="required-mark" aria-hidden="true">*</span></label>
          <select class="input" id="category-populated" name="category" aria-describedby="error-category-populated">
            <option value="" disabled selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Housing">Housing</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <p class="field-error" id="error-category-populated" role="alert"></p>
        </div>
        <div class="form-field">
          <label class="label" for="description-populated">Description <span class="u-text-muted">(optional)</span></label>
          <textarea class="input" id="description-populated" name="description" rows="3" placeholder="e.g. Team lunch at Cafe Luna"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('populated')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn-populated">Save expense</button>
        </div>
      </form>
    </div>
  </div>
</div>

</div>

<script>
  // ---------- Fixture data (inline; no network calls) ----------
  const state = {
    empty: [],
    populated: [
      { amount: 42.50,  date: '2026-09-20', category: 'Food',          description: 'Team lunch at Cafe Luna' },
      { amount: 128.00, date: '2026-09-18', category: 'Transport',     description: 'Monthly train pass' },
      { amount: 15.99,  date: '2026-09-15', category: 'Entertainment', description: 'Movie tickets' },
      { amount: 950.00, date: '2026-09-01', category: 'Housing',       description: 'September rent share' },
    ],
  };

  const CATEGORY_ICONS = {
    Food: '🍔',
    Transport: '🚗',
    Housing: '🏠',
    Entertainment: '🎬',
    Other: '🗂️',
  };

  const FIELD_ERRORS = {
    amount: 'Enter an amount to continue.',
    date: 'Select a date to continue.',
    category: 'Choose a category to continue.',
  };

  let lastFocused = {};

  function formatCurrency(amount) {
    return '$' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderList(key) {
    const listEl = document.getElementById(`list-${key}`);
    const emptyEl = document.getElementById(`empty-state-${key}`);
    const totalEl = document.getElementById(`total-${key}`);
    const items = state[key];

    if (totalEl) {
      if (items.length === 0) {
        totalEl.textContent = 'No expenses recorded yet';
      } else {
        const total = items.reduce((sum, e) => sum + e.amount, 0);
        totalEl.textContent = `${items.length} expense${items.length === 1 ? '' : 's'} · ${formatCurrency(total)} total`;
      }
    }

    if (items.length === 0) {
      listEl.style.display = 'none';
      listEl.innerHTML = '';
      if (emptyEl) emptyEl.style.display = 'block';
      return;
    }
    if (emptyEl) emptyEl.style.display = 'none';
    listEl.style.display = 'flex';

    listEl.innerHTML = items.map((exp, i) => `
      <div class="expense-row card${i === 0 && exp._isNew ? ' expense-row-new' : ''}">
        <div class="expense-row-main">
          <span class="chip">${CATEGORY_ICONS[exp.category] || '🗂️'} ${escapeHtml(exp.category)}</span>
          <span class="expense-desc">${exp.description ? escapeHtml(exp.description) : 'No description'}</span>
        </div>
        <div class="expense-row-meta">
          <span class="expense-date u-text-sm u-text-muted">${formatDate(exp.date)}</span>
          <span class="expense-amount">${formatCurrency(exp.amount)}</span>
        </div>
      </div>
    `).join('');

    // clear the transient "_isNew" flag after the highlight has had a chance to render
    items.forEach(e => { e._isNew = false; });
  }

  function updateAmountPreview(key) {
    const input = document.getElementById(`amount-${key}`);
    const preview = document.getElementById(`preview-amount-${key}`);
    const val = parseFloat(input.value);
    preview.textContent = input.value && !isNaN(val) ? `You'll record: ${formatCurrency(val)}` : '';
  }

  function setFieldInvalid(key, field, invalid) {
    const el = document.getElementById(`${field}-${key}`);
    const err = document.getElementById(`error-${field}-${key}`);
    if (invalid) {
      el.classList.add('input-invalid');
      el.setAttribute('aria-invalid', 'true');
      err.textContent = `⚠ ${FIELD_ERRORS[field]}`;
      err.style.display = 'block';
    } else {
      el.classList.remove('input-invalid');
      el.removeAttribute('aria-invalid');
      err.textContent = '';
      err.style.display = 'none';
    }
  }

  function validate(key) {
    let valid = true;
    ['amount', 'date', 'category'].forEach((field) => {
      const el = document.getElementById(`${field}-${key}`);
      const invalid = !el.value;
      if (invalid) valid = false;
      setFieldInvalid(key, field, invalid);
    });
    return valid;
  }

  function resetForm(key) {
    ['amount', 'date', 'category', 'description'].forEach((field) => {
      document.getElementById(`${field}-${key}`).value = '';
      setFieldInvalid(key, field, false);
    });
    document.getElementById(`preview-amount-${key}`).textContent = '';
  }

  function openModal(key) {
    lastFocused[key] = document.activeElement;
    document.getElementById(`overlay-${key}`).classList.add('is-open');
    document.getElementById(`amount-${key}`).focus();
  }

  function closeModal(key) {
    document.getElementById(`overlay-${key}`).classList.remove('is-open');
    resetForm(key);
    if (lastFocused[key]) lastFocused[key].focus();
  }

  function handleDialogKeydown(event, key) {
    if (event.key === 'Escape') {
      closeModal(key);
      return;
    }
    if (event.key !== 'Tab') return;
    const dialog = document.getElementById(`dialog-${key}`);
    const focusable = Array.from(dialog.querySelectorAll('button, input, select, textarea'))
      .filter((el) => !el.disabled && el.offsetParent !== null);
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function handleSubmit(event, key) {
    event.preventDefault();
    if (!validate(key)) return;

    const amount = parseFloat(document.getElementById(`amount-${key}`).value);
    const date = document.getElementById(`date-${key}`).value;
    const category = document.getElementById(`category-${key}`).value;
    const description = document.getElementById(`description-${key}`).value.trim();

    const saveBtn = document.getElementById(`save-btn-${key}`);
    const cancelBtn = saveBtn.parentElement.querySelector('.btn-secondary');
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    setTimeout(() => {
      state[key].unshift({ amount, date, category, description, _isNew: true });
      renderList(key);
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      saveBtn.textContent = 'Save expense';
      closeModal(key);
    }, 300);
  }

  renderList('empty');
  renderList('populated');

  // ---------- Reviewer bar ----------
  const screens = Array.from(document.querySelectorAll('.screen'));
  let cur = 0;
  function show(i) {
    cur = Math.max(0, Math.min(screens.length - 1, i));
    screens.forEach((s, j) => s.style.display = j === cur ? 'block' : 'none');
    document.getElementById('screen-label').textContent =
      `${cur + 1} / ${screens.length}: ${screens[cur].dataset.name}`;
  }
  document.getElementById('prev-btn').onclick = () => show(cur - 1);
  document.getElementById('next-btn').onclick = () => show(cur + 1);
  document.addEventListener('keydown', (e) => {
    const anyModalOpen = document.querySelector('.modal-overlay.is-open');
    if (anyModalOpen) return; // let the modal own arrow/Esc keys while open
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  show(0);
</script>
</body>
</html>
