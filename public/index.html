<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker</title>
<link rel="stylesheet" href="../design-system/tokens.css" />
<link rel="stylesheet" href="../design-system/prototype-utils.css" />
<link rel="stylesheet" href="./css/expenses.css" />
<link rel="stylesheet" href="/styles.css" />
<script src="./js/expenses.js" defer></script>
</head>
<body class="u-surface">

  <div class="app-topbar">
    <span class="brand">Expense Tracker</span>
    <nav class="app-nav">
      <a href="#" class="active" aria-current="page">Expenses</a>
      <a href="#" onclick="return false;">Employees</a>
    </nav>
  </div>

  <div class="page">
    <div class="page-header">
      <h1>Expenses</h1>
      <p>Review and correct submitted expense records.</p>
    </div>

    <div class="card table-card">
      <div class="table-scroll">
        <table class="expense-table">
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Category</th>
              <th scope="col">Description</th>
              <th scope="col" class="col-amount">Amount</th>
              <th scope="col" class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="expense-tbody">
            <!-- rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit modal: hidden until an "Edit" action is activated -->
  <div class="modal-overlay" id="modal-overlay" hidden></div>
  <div class="modal-wrap" id="modal-wrap" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <div>
          <h2 id="modal-title">Edit expense</h2>
          <p>Update any field, then save to apply the correction.</p>
        </div>
        <button class="icon-btn" id="modal-close-btn" type="button" aria-label="Close dialog without saving">✕</button>
      </div>

      <form id="edit-form" novalidate>
        <div class="field">
          <label class="label" for="field-amount">Amount</label>
          <div class="amount-input-wrap">
            <span class="amount-prefix" aria-hidden="true">$</span>
            <input class="input amount-input" id="field-amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" aria-describedby="error-amount" />
          </div>
          <p class="field-error" id="error-amount" role="alert" hidden>⚠ Amount is required.</p>
        </div>

        <div class="field">
          <label class="label" for="field-date">Date</label>
          <input class="input" id="field-date" name="date" type="date" aria-describedby="error-date" />
          <p class="field-error" id="error-date" role="alert" hidden>⚠ Date is required.</p>
        </div>

        <div class="field">
          <label class="label" for="field-category">Category</label>
          <select class="input" id="field-category" name="category" aria-describedby="error-category">
            <option value="">Select a category</option>
            <option>Travel</option>
            <option>Meals</option>
            <option>Software</option>
            <option>Office Supplies</option>
            <option>Other</option>
          </select>
          <p class="field-error" id="error-category" role="alert" hidden>⚠ Category is required.</p>
        </div>

        <div class="field" style="margin-bottom: 0;">
          <label class="label" for="field-description">Description <span style="font-weight: var(--font-weight-regular); color: var(--color-fg-muted);">(optional)</span></label>
          <textarea class="input" id="field-description" name="description" rows="2"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save-btn">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span aria-hidden="true">✓</span>
    <span id="toast-message">Expense updated</span>
  </div>

  <!--
    TODO(rebase): uncertain merge — please review.
    This block (id="expenses"/"root"/"dialog" + currency/validation/expensesView/app
    scripts) implements "Add Expense" + "Delete Expense with Confirmation" against the
    backend REST API (src/expenses). It was originally the only content of this page,
    written before TEST-M1-STORY-032 ("Edit Expense via Modal Form", merged after this
    branch was created) replaced the page body above with a localStorage-backed table +
    edit modal. Both are kept side by side so neither feature's tests/behavior regress,
    but product/design should decide how to reconcile a single expense list UI.
  -->
  <div id="error"></div>
  <main id="expenses">
    <div id="root"></div>
  </main>
  <div id="dialog"></div>
  <script src="/currency.js"></script>
  <script src="/validation.js"></script>
  <script src="/expensesView.js"></script>
  <script src="/app.js"></script>
  <script>
    renderApp(document.getElementById('root'));
  </script>
</body>
</html>
